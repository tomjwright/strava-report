services:
  - type: web
    name: strava-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run clean_dashboard.py --server.port=$PORT --server.address=0.0.0.0
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: STRAVA_CLIENT_ID
        sync: false
      - key: STRAVA_CLIENT_SECRET
        sync: false