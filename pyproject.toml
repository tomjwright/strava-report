[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "strava-report"
version = "0.1.0"
description = "Strava activity dashboard with real-time streaming and medallion ETL architecture"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Backend Framework
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    
    # Database
    "sqlalchemy>=2.0.23",
    "alembic>=1.12.1",
    "psycopg2-binary>=2.9.9",
    "supabase>=2.3.0",
    
    # Data Processing
    "pandas>=2.1.3",
    "numpy>=1.26.0",
    
    # API Client
    "httpx>=0.25.2",
    "requests>=2.31.0",
    
    # Environment Management
    "python-dotenv>=1.0.0",
    "pydantic[email]>=2.5.0",
    
    # Logging
    "loguru>=0.7.2",
    
    # Testing
    "pytest>=7.4.3",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.1",
    "httpx>=0.25.2",
    
    # Data Quality
    "great-expectations>=0.17.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.11.0",
    "pylint>=3.0.3",
    "mypy>=1.7.1",
    "pre-commit>=3.6.0",
]
frontend = [
    "streamlit>=1.29.0",
    "plotly>=5.18.0",
    "altair>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/strava-report"
Repository = "https://github.com/yourusername/strava-report"
Issues = "https://github.com/yourusername/strava-report/issues"

[tool.setuptools]
package-dir = {"" = "."}

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-ignore = ['E203', 'W503']

[tool.pylint.messages_control]
disable = ["C0111", "C0103"]

[tool.pylint.format]
max-line-length = "100"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=backend --cov-report=html --cov-report=term-missing"
asyncio_mode = "auto"
