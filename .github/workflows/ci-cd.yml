name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint mypy
        pip install -r requirements.txt
    
    - name: Run Black
      run: black --check backend/ tests/
    
    - name: Run Pylint
      run: pylint backend/app --fail-under=8.0
      continue-on-error: true  # Don't fail the build, just report
    
    - name: Run MyPy
      run: mypy backend/app --ignore-missing-imports
      continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        STRAVA_CLIENT_ID: test_id
        STRAVA_CLIENT_SECRET: test_secret
        STRAVA_REFRESH_TOKEN: test_token
        STRAVA_WEBHOOK_VERIFY_TOKEN: test_verify_token
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_KEY: test_key
        SUPABASE_SERVICE_KEY: test_service_key
      run: |
        pytest tests/unit/ -v --cov=backend --cov-report=xml --cov-report=term
    
    - name: Run integration tests
      env:
        DATABASE_URL: postgresql://testuser:testpass@localhost:5432/testdb
        STRAVA_CLIENT_ID: test_id
        STRAVA_CLIENT_SECRET: test_secret
        STRAVA_REFRESH_TOKEN: test_token
        STRAVA_WEBHOOK_VERIFY_TOKEN: test_verify_token
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_KEY: test_key
        SUPABASE_SERVICE_KEY: test_service_key
      run: |
        pytest tests/integration/ -v --cov=backend --cov-append --cov-report=xml --cov-report=term
    
    - name: Upload coverage reports
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  dbt-test:
    name: dbt Tests
    runs-on: ubuntu-latest
    needs: lint
    
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpass
          POSTGRES_DB: testdb
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install dbt-postgres dbt-core
    
    - name: Set up dbt profiles
      run: |
        mkdir -p ~/.dbt
        cp dbt/profiles.yml ~/.dbt/profiles.yml
        echo "DB_HOST=localhost" >> $GITHUB_ENV
        echo "DB_USER=testuser" >> $GITHUB_ENV
        echo "DB_PASSWORD=testpass" >> $GITHUB_ENV
        echo "DB_PORT=5432" >> $GITHUB_ENV
        echo "DB_NAME=testdb" >> $GITHUB_ENV
    
    - name: Run dbt deps
      working-directory: ./dbt
      run: dbt deps
    
    - name: Run dbt run
      working-directory: ./dbt
      env:
        DB_HOST: localhost
        DB_USER: testuser
        DB_PASSWORD: testpass
        DB_PORT: 5432
        DB_NAME: testdb
      run: dbt run
    
    - name: Run dbt test
      working-directory: ./dbt
      env:
        DB_HOST: localhost
        DB_USER: testuser
        DB_PASSWORD: testpass
        DB_PORT: 5432
        DB_NAME: testdb
      run: dbt test

  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    needs: [test, dbt-test]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate package
      run: |
        cd backend
        python -c "from app.main import app; print('Application imports successfully')"

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy notification
      run: |
        echo "Deploying to staging environment"
        # Add actual deployment commands here
        # For example: deploy to Streamlit, Render, or other hosting

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy notification
      run: |
        echo "Deploying to production environment"
        # Add actual deployment commands here
        # For example: deploy to Streamlit Cloud, Render, or other hosting
    
    - name: Run database migrations
      run: |
        echo "Running database migrations"
        # Add migration commands here
