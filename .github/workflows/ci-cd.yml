name: CI/CD Pipeline - GitFlow

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install black pylint mypy
        pip install -r requirements.txt
    
    - name: Run Black
      run: black --check backend/ frontend/
      continue-on-error: true
    
    - name: Run Pylint
      run: pylint backend/app --fail-under=6.0
      continue-on-error: true
    
    - name: Run MyPy
      run: mypy backend/app --ignore-missing-imports
      continue-on-error: true

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    needs: lint
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Run unit tests
      env:
        STRAVA_CLIENT_ID: test_id
        STRAVA_CLIENT_SECRET: test_secret
        STRAVA_REFRESH_TOKEN: test_token
        STRAVA_WEBHOOK_VERIFY_TOKEN: test_verify_token
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_KEY: test_key
        SUPABASE_SERVICE_KEY: test_service_key
        DATABASE_URL: ""
      run: |
        pytest tests/unit/ -v --cov=backend --cov-report=xml --cov-report=term || true
    
    - name: Run integration tests
      env:
        STRAVA_CLIENT_ID: test_id
        STRAVA_CLIENT_SECRET: test_secret
        STRAVA_REFRESH_TOKEN: test_token
        STRAVA_WEBHOOK_VERIFY_TOKEN: test_verify_token
        SUPABASE_URL: https://test.supabase.co
        SUPABASE_KEY: test_key
        SUPABASE_SERVICE_KEY: test_service_key
        DATABASE_URL: ""
      run: |
        pytest tests/integration/ -v --cov=backend --cov-append --cov-report=xml --cov-report=term || true

  build:
    name: Build and Validate
    runs-on: ubuntu-latest
    needs: test
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Validate backend
      run: |
        cd backend
        python -c "from app.main import app; print('Backend imports successfully')"
    
    - name: Validate frontend
      run: |
        cd frontend
        python -c "import streamlit; print('Frontend imports successfully')"
    
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    environment: staging
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to staging
      run: |
        echo "🚀 Deploying to staging environment"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        # Add actual deployment commands here
    
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Deploy to production
      run: |
        echo "🚀 Deploying to PRODUCTION environment"
        echo "Branch: ${{ github.ref_name }}"
        echo "Commit: ${{ github.sha }}"
        # Add actual deployment commands here